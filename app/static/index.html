<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imagen a DXF</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:900px;margin:0 auto;padding:16px;color:#222}
  fieldset{border:1px solid #ccc;border-radius:8px;margin:12px 0}
  label{display:block;margin:8px 0;font-size:14px}
  input[type=number],select{width:100px}
  button{padding:10px 18px;margin:4px 8px 4px 0;font-size:15px;cursor:pointer}
  #preview{margin-top:16px;border:1px solid #ddd;background:
    repeating-conic-gradient(#f3f3f3 0% 25%,#fff 0% 50%) 0 0/16px 16px;min-height:80px}
  #preview svg{max-width:100%;height:auto;display:block}
  #msg{color:#b00020} #info{color:#666;font-size:13px}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0 24px}
</style>
</head>
<body>
<h1>Imagen a vectores / DXF</h1>
<input type="file" id="file" accept="image/*">
<fieldset><legend>Perspectiva (foto tomada en ángulo)</legend>
  <p style="font-size:13px;color:#555;margin:4px 0">Detecta el panel o marca sus 4 esquinas con clics sobre la foto. Se endereza antes de vectorizar.</p>
  <button type="button" id="detect">Detectar panel</button>
  <button type="button" id="pick">Marcar esquinas</button>
  <button type="button" id="clear">Quitar</button>
  <label><input type="checkbox" id="use_persp"> Enderezar con estas esquinas</label>
  <div class="cols">
    <label>Esquinas (x1,y1,…,x4,y4) <input type="text" id="corners" size="34"></label>
    <label>Proporción real ancho/alto (opcional) <input type="number" id="aspect" min="0.05" step="0.01"></label>
    <label>Recortar borde (0–0.2) <input type="number" id="inset" value="0.01" min="0" max="0.2" step="0.005"></label>
  </div>
  <div style="position:relative;display:inline-block;max-width:100%"><canvas id="cv" style="max-width:100%;display:none;cursor:crosshair"></canvas></div>
  <div><button type="button" id="rect_btn">Ver enderezada</button></div>
  <img id="rect_img" style="max-width:100%;display:none;border:1px solid #ddd;margin-top:8px">
</fieldset>
<fieldset><legend>Vectorización</legend><div class="cols">
  <label>Colores (1 = blanco y negro, 2-16 = capas)
    <input type="number" id="colors" value="1" min="1" max="16"></label>
  <label><input type="checkbox" id="curves" checked> Curvas Bézier (desmarcar = polígonos)</label>
  <label>Suavidad de esquinas (0 - 1.33) <input type="number" id="smooth" value="1" min="0" max="1.33" step="0.1"></label>
  <label>Umbral B/N (vacío = auto) <input type="number" id="threshold" min="0" max="255"></label>
  <label><input type="checkbox" id="invert"> Invertir (trazar zonas claras)</label>
  <label>Reducir ruido (blur) <input type="number" id="blur" value="0" min="0" max="31"></label>
  <label>Área mínima (px²) <input type="number" id="min_area" value="20" min="0"></label>
  <label><input type="checkbox" id="centerline"> Línea central (trazos finos: planos, firmas, texto)</label>
  <label>Largo mínimo de línea (px, línea central) <input type="number" id="min_length" value="10" min="0"></label>
  <label>Recorte x0,y0,x1,y1 (px, opcional) <input type="text" id="crop" placeholder="60,50,795,1195" size="20"></label>
  <label><input type="checkbox" id="skip_background" checked> Ignorar color de fondo</label>
</div></fieldset>
<fieldset><legend>DXF</legend><div class="cols">
  <label>Ancho final (mm, vacío = usar escala) <input type="number" id="width_mm" min="0" step="1"></label>
  <label>Escala (mm por píxel) <input type="number" id="scale" value="1" min="0.001" step="0.01"></label>
  <label>Curvas en DXF
    <select id="dxf_curves"><option value="spline">Splines</option>
    <option value="polyline">Polilíneas (más compatible)</option></select></label>
</div></fieldset>
<button id="preview_btn">Vista previa</button>
<button id="dxf">Descargar DXF</button>
<button id="dwg" style="display:none" title="AutoCAD R2000 (experimental)">Descargar DWG</button>
<button id="svg">Descargar SVG</button>
<button id="zip">Descargar ambos (ZIP)</button>
<span id="msg"></span> <span id="info"></span>
<div id="preview"></div>
<script>
const $ = id => document.getElementById(id);
async function run(format, download){
  $('msg').textContent = ''; $('info').textContent = '';
  const f = $('file').files[0];
  if(!f){ $('msg').textContent = 'Elige una imagen'; return; }
  const fd = new FormData();
  fd.append('file', f);
  fd.append('format', format);
  for(const k of ['colors','smooth','threshold','blur','min_area','min_length','width_mm','scale','dxf_curves','crop','aspect'])
    if($(k).value !== '') fd.append(k, $(k).value);
  for(const k of ['invert','curves','skip_background','centerline']) fd.append(k, $(k).checked);
  if($('use_persp').checked && $('corners').value){ fd.append('corners', $('corners').value); fd.append('inset', $('inset').value); }
  $('info').textContent = 'Procesando…';
  const r = await fetch('/api/convert', {method:'POST', body:fd});
  $('info').textContent = '';
  if(!r.ok){
    let d = 'Error'; try{ const j = await r.json(); d = typeof j.detail === 'string' ? j.detail : JSON.stringify(j.detail); }catch(e){}
    $('msg').textContent = d; return;
  }
  const blob = await r.blob();
  if(format === 'svg') $('preview').innerHTML = await blob.text();
  if(download){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = f.name.replace(/\.[^.]+$/, '') + '.' + format; a.click();
  }
}
/* ---- selector de esquinas ---- */
let img = null, pts = [], picking = false;
const cv = $('cv'), ctx = cv.getContext('2d');
function redraw(){
  if(!img) return;
  cv.width = img.naturalWidth; cv.height = img.naturalHeight; cv.style.display = 'block';
  ctx.drawImage(img, 0, 0);
  const r = Math.max(6, cv.width / 120);
  ctx.lineWidth = r / 2; ctx.strokeStyle = '#e00'; ctx.fillStyle = '#e00';
  ctx.beginPath(); pts.forEach((p,i)=> i ? ctx.lineTo(p[0],p[1]) : ctx.moveTo(p[0],p[1]));
  if(pts.length === 4) ctx.closePath(); ctx.stroke();
  pts.forEach(p => { ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, 7); ctx.fill(); });
  $('corners').value = pts.length === 4 ? pts.map(p => p.map(Math.round).join(',')).join(',') : '';
  $('use_persp').checked = pts.length === 4;
}
$('file').onchange = () => {
  const f = $('file').files[0]; pts = []; $('rect_img').style.display = 'none';
  if(!f) return;
  img = new Image(); img.onload = redraw; img.src = URL.createObjectURL(f);
};
cv.onclick = e => {
  if(!picking) return;
  const b = cv.getBoundingClientRect();
  pts.push([(e.clientX - b.left) * cv.width / b.width, (e.clientY - b.top) * cv.height / b.height]);
  if(pts.length === 4) picking = false;
  redraw();
};
$('pick').onclick = () => { if(!img){ $('msg').textContent = 'Elige una imagen'; return; } pts = []; picking = true; $('msg').textContent = 'Haz clic en las 4 esquinas del panel'; redraw(); };
$('clear').onclick = () => { pts = []; picking = false; $('rect_img').style.display = 'none'; $('msg').textContent = ''; redraw(); };
$('corners').oninput = () => {
  const v = $('corners').value.split(',').map(Number);
  if(v.length === 8 && v.every(x => !isNaN(x))){ pts = [0,1,2,3].map(i => [v[2*i], v[2*i+1]]); const c = $('corners').value; redraw(); $('corners').value = c; $('use_persp').checked = true; }
};
$('detect').onclick = async () => {
  const f = $('file').files[0]; if(!f){ $('msg').textContent = 'Elige una imagen'; return; }
  $('msg').textContent = ''; $('info').textContent = 'Buscando panel…';
  const fd = new FormData(); fd.append('file', f);
  const j = await (await fetch('/api/detect-panel', {method:'POST', body:fd})).json();
  $('info').textContent = '';
  if(!j.corners){ $('msg').textContent = 'No se encontró el panel: márcalo con clics'; return; }
  pts = j.corners; redraw();
};
$('rect_btn').onclick = async () => {
  const f = $('file').files[0];
  if(!f || !$('corners').value){ $('msg').textContent = 'Detecta o marca las esquinas primero'; return; }
  const fd = new FormData(); fd.append('file', f);
  fd.append('corners', $('corners').value); fd.append('inset', $('inset').value);
  if($('aspect').value) fd.append('aspect', $('aspect').value);
  const r = await fetch('/api/rectify', {method:'POST', body:fd});
  if(!r.ok){ $('msg').textContent = (await r.json()).detail || 'Error'; return; }
  $('rect_img').src = URL.createObjectURL(await r.blob()); $('rect_img').style.display = 'block';
};
$('preview_btn').onclick = () => run('svg', false);
$('svg').onclick = () => run('svg', true);
$('dxf').onclick = () => run('dxf', true);
$('zip').onclick = () => run('zip', true);
$('dwg').onclick = () => run('dwg', true);
fetch('/api/capabilities').then(r => r.json()).then(j => { if(j.formats.includes('dwg')) $('dwg').style.display = ''; }).catch(() => {});
</script>
</body>
</html>
